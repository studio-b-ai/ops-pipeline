name: Credential Expiry Monitor

# CLAUDE.md Rule #302 — active expiry monitoring for every expiring production credential.
# Standalone scheduled job (NOT a reusable workflow_call like sync.yml). Daily it reads each
# manifest item's value via the read-only Infra-vault 1Password SA, runs an active probe for the
# REAL expiry/aliveness, and routes WARN/DEAD/NO_EXPIRY/PROBE_FAILED → #agent-escalations (deduped)
# plus a daily beacon → #agent-notifications (its absence is the monitor's own staleness signal).
#
# Kevin-gated secrets (ops-pipeline currently holds none — see scripts/CREDENTIAL-MONITOR.md):
#   OP_SERVICE_ACCOUNT_INFRA   read-only "Studio B Infrastructure" 1P Service Account token
#   STUDIOB_SLACK_BOT_TOKEN    studiob-ai workspace bot token (Rule #32 — the alert channels)
#   ENTRA_TENANT_ID / ENTRA_CLIENT_ID / ENTRA_CLIENT_SECRET  (optional) Graph probe identity
#                              (Application.Read.All) — absent ⇒ the entra item degrades to PROBE_FAILED

on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC (GH Actions cron is UTC-only — Rule #94)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify from recorded dates only — no secrets, no Slack posts"
        type: boolean
        default: false

permissions:
  contents: write # commit the dedup state file (scripts/credential-alert-state.json)

concurrency:
  group: credential-expiry-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install 1Password CLI
        if: ${{ !inputs.dry_run }}
        uses: 1password/install-cli-action@v1

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Run credential expiry monitor
        working-directory: scripts
        env:
          OP_SERVICE_ACCOUNT_INFRA: ${{ secrets.OP_SERVICE_ACCOUNT_INFRA }}
          STUDIOB_SLACK_BOT_TOKEN: ${{ secrets.STUDIOB_SLACK_BOT_TOKEN }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: npx tsx credential-expiry-monitor.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit dedup state if changed
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          # `git add` first so the check catches an untracked file too (e.g. a first run
          # before the seed []-state is present), not just tracked diffs.
          git add scripts/credential-alert-state.json
          if ! git diff --staged --quiet -- scripts/credential-alert-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(cred-monitor): update alert dedup state [skip ci]"
            git push
          fi

name: Credential Expiry Monitor

# CLAUDE.md Rule #302 — active expiry monitoring for every expiring production credential.
# Standalone scheduled job (NOT a reusable workflow_call like sync.yml). Daily it reads each
# manifest item's value via the read-only Infra-vault 1Password SA, runs an active probe for the
# REAL expiry/aliveness, and classifies WARN/DEAD/NO_EXPIRY/PROBE_FAILED (probing logic itself is
# UNCHANGED by the v2 conversion below).
#
# v2 (2026-07-31, Kevin directive): alerts are GITHUB ISSUES in this repo (`credential-monitor`
# label), not Slack posts — mirrors gateway-token-watch.yml / railway-volume-monitor.yml. One
# issue per credential, auto-closed with a comment when it returns to OK; a severity change on an
# already-open issue (e.g. a WARN band tightening) comments + retitles in place. Issues ARE the
# dedup state, so v1's committed state file and its `[skip ci]` commit step are gone.
#
# Kevin-gated secrets (ops-pipeline currently holds none — see scripts/CREDENTIAL-MONITOR.md):
#   OP_SERVICE_ACCOUNT_INFRA   read-only "Studio B Infrastructure" 1P Service Account token
#   ENTRA_TENANT_ID / ENTRA_CLIENT_ID / ENTRA_CLIENT_SECRET  (optional) Graph probe identity
#                              (Application.Read.All) — absent ⇒ the entra item degrades to PROBE_FAILED
#   (GitHub access = the workflow's own GITHUB_TOKEN via GH_TOKEN — not Kevin-gated.)

on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC (GH Actions cron is UTC-only — Rule #94)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify from recorded dates only — no secrets, no probe network calls (still reads real GitHub issue state, no mutations)"
        type: boolean
        default: false

permissions:
  issues: write # open/close/comment/retitle credential-monitor alert issues (they ARE the alert state)
  contents: read

concurrency:
  group: credential-expiry-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install 1Password CLI
        if: ${{ !inputs.dry_run }}
        uses: 1password/install-cli-action@v1

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Run credential expiry monitor
        working-directory: scripts
        env:
          OP_SERVICE_ACCOUNT_INFRA: ${{ secrets.OP_SERVICE_ACCOUNT_INFRA }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: npx tsx credential-expiry-monitor.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

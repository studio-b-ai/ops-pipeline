name: Railway Volume Monitor

# CLAUDE.md Rule #302 family — fleet-wide Railway volume-usage monitoring.
#
# Origin (2026-07-27, Kevin-authorized): the aesthetik-production `Postgres` service's 500MB
# Railway volume sat at ≥96% for 24h+ with ZERO alerting, hit 100%, and crash-looped ~10 hours,
# taking the whole Acumatica gateway down.
#
# v2 (2026-07-31, Kevin directive): alerts are GITHUB ISSUES in this repo (`volume-monitor`
# label), not Slack posts — mirrors gateway-token-watch.yml. One issue per volume instance
# (open = usage at/above WARN; auto-closes with a comment on recovery); a per-project fetch
# failure gets its own binary issue; all-projects-failed opens a MONITOR BLIND issue too. Issues
# ARE the dedup state, so v1's committed state file and its `[skip ci]` commit step are gone.
#
# Every 6h: for every project visible to RAILWAY_API_TOKEN (root `projects()` query, falling back
# to scripts/railway-projects.manifest.yaml when that field errors for this token — a REAL,
# verified-live degradation path, see scripts/lib/railway-volume-probes.ts file header), classify
# every volume instance with `sizeMB > 0` into OK / WARN (≥75%) / CRITICAL (≥90%).
#
# Kevin-gated secret this workflow needs:
#   RAILWAY_API_TOKEN       Railway API token with read access to the projects being monitored.
#                           NOT provisioned as part of this PR (Rule #363 — no secret values in the
#                           repo) — Kevin's session sets it via
#                             gh secret set RAILWAY_API_TOKEN --repo studio-b-ai/ops-pipeline --body "$TOKEN"
#                           (Rule #98 — direct --body, never stdin.)
#   (GitHub access = the workflow's own GITHUB_TOKEN via GH_TOKEN below.)
#
# ⚠️ GitHub Actions does not validate Actions-identifier rules (job keys / step ids) at authoring
# time (Rules #198/#280) — after merge, run `gh workflow run "Railway Volume Monitor"
# --repo studio-b-ai/ops-pipeline` once and confirm a real run appears, don't just trust the diff.

on:
  schedule:
    - cron: "27 */6 * * *" # every 6h (GH Actions cron is UTC-only — Rule #94)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the real query + issue list but perform no issue mutations"
        type: boolean
        default: false

permissions:
  issues: write # open/close/comment/retitle volume-monitor alert issues (they ARE the alert state)
  contents: read

concurrency:
  group: railway-volume-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Run Railway volume monitor
        working-directory: scripts
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: npx tsx railway-volume-monitor.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

name: Gateway Token Watch

# CLAUDE.md Rule #279 — the deterministic trigger behind the 2026-07-30 per-consumer
# gateway-token rollout's revocation gate. See scripts/gateway-token-watch.ts header for the
# full design (Rule #413 durable-table read of acumatica_tenant_tokens.last_used_at).
#
# v2 (Kevin directive 2026-07-30): alerts are GITHUB ISSUES in this repo (`token-watch`
# label), not Slack posts — open issue = condition active; the monitor auto-closes issues
# when conditions clear. Issues ARE the dedup state, so v1's committed state file and its
# [skip ci] commit step are gone. Never revokes anything itself (Rule #97).
#
# Daily: legacy token used after the cutover → straggler issue; all legacy quiet ≥3 days →
# one-time "revocation gate GREEN" issue (closing it = human ack; never reopened on
# still-green).
#
# Secrets:
#   GATEWAY_DATABASE_URL  gateway Postgres (public proxy — GHA can't reach railway-internal).
#                         ⚠️ Rule #99 dual-store: same value as studiob-api's DATABASE_URL —
#                         rotate BOTH together when the DB moves off the public proxy.
#   (GitHub access = the workflow's own GITHUB_TOKEN via GH_TOKEN below.)
#
# ⚠️ Rules #198/#280: after merge, `gh workflow run "Gateway Token Watch"` once and confirm a
# completed run — CI does not validate Actions-identifier rules.

on:
  schedule:
    - cron: "7 13 * * *" # daily 13:07 UTC = 09:07 ET (GH cron is UTC-only — Rule #94)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the real query + issue list but perform no issue mutations"
        type: boolean
        default: false

permissions:
  issues: write # open/close token-watch alert issues (they ARE the alert state)
  contents: read

concurrency:
  group: gateway-token-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Run gateway token watch
        working-directory: scripts
        env:
          GATEWAY_DATABASE_URL: ${{ secrets.GATEWAY_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: npx tsx gateway-token-watch.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

name: Squasher auto-merge gate (reusable)

# CLAUDE.md Rule #279 amendment — Kevin-approved 2026-07-30, widened to gate v2
# (Kevin-approved 2026-08-02: ci-infra + test-only diff classes). The ONE narrow,
# explicitly-scoped exception to the never-auto-merge law (#97): a bug-squasher CCR
# pull request auto-merges ONLY when every leg in scripts/lib/automerge-classify.ts
# passes. See scripts/pr-automerge-gate.ts for the full leg list and design
# rationale (fail-closed classification, cost-ordered legs, SHA-pinned merge).
#
# This is the REUSABLE half — it lives here so every fenced-in caller repo shares one
# canonical gate implementation. Callers `uses:` this workflow and pass `repo` +
# `pr_number`; see studio-b-ai/studiob's .github/workflows/squasher-automerge.yml for
# the original caller shape and studio-b-ai/bolt-wms's for the gate-v2 canary caller.
#
# `enabled_classes` DEFAULTS TO "docs-comment" — a caller that never sets this input
# (studiob's existing, unmodified caller included) gets EXACTLY the original #279
# gate's scope, unchanged, even though this reusable workflow's implementation now
# also knows about ci-infra/test-only. Opting into the wider gate-v2 classes is an
# explicit, per-repo `with:` input (see bolt-wms's canary caller), never a side
# effect of this file merging. `sensitive_path_patterns` is an escape hatch for
# callers whose branch-protection gates aren't independently verifiable from
# `statusCheckRollup` — any matching path is excluded from classification entirely.
#
# ops#190 B1 (2026-08-29) adds the `code-fix` class + two inputs that exist ONLY for
# it: `safe_path_globs` (allowlist-primary — every changed file must match one; the
# EMPTY default makes the class INERT even when enabled, fail-closed) and
# `required_checks` (named checks that must be strictly SUCCESS on the head commit;
# EMPTY default = the named-checks leg fails closed). Both default "" so B1 merging
# changes NOTHING for any existing caller — enabling code-fix is a deliberate
# three-input per-repo opt-in (B3 ladder), never a side effect of this file.
#
# Pinning note: this workflow checks out studio-b-ai/ops-pipeline at `main` (NOT the
# repo's `@v1` tag convention used by sync.yml/drift-check.yml) — this is a brand-new,
# single-repo Rule #169 canary, not yet part of the vetted `@v1` fleet. Graduating it
# to `@v1` pinning (both for this checkout step AND for how callers reference this
# workflow's own `uses:` ref) is a follow-up once the pilot proves out — a controller
# decision, not automated here. Because BOTH studiob's and bolt-wms's callers pin
# `@main`, merging the gate-v2 PR activates the NEW CLASSIFICATION CODE PATH for
# every caller immediately — but `enabled_classes` defaulting to "docs-comment" is
# what actually confines the new AUTO-MERGE BEHAVIOR to bolt-wms's opt-in. No tag
# move is needed for this rollout; see the PR body for the exact activation order.
#
# Secrets:
#   ANTHROPIC_API_KEY        the independent-review leg (Claude Sonnet 5).
#   FLEET_APP_ID /           ops#250: the studiob-fleet-bot App mint. The gate now
#   FLEET_APP_PRIVATE_KEY    runs on an App INSTALLATION token, not github.token —
#                            GitHub suppresses workflow triggers for GITHUB_TOKEN-
#                            caused events (Rule #38), so every autonomous merge
#                            silently disarmed the target repo's post-merge tripwire
#                            and push-to-main workflows (wr#806, 2026-08-31 = the
#                            known-bad baseline). App-token merges trigger normally.
#                            REQUIRED, no fallback — an optional-with-fallback shape
#                            would let the suppression silently return (#412/#464),
#                            and it fail-closes any un-retired legacy per-repo caller
#                            loudly (callers can never hold the PEM under D3; the
#                            fleet sweep in THIS repo is the only sanctioned caller).
#                            Design: docs/plans/2026-08-31-ops250-squasher-fleet-sweep.md

on:
  workflow_call:
    inputs:
      repo:
        description: "org/repo of the PR being evaluated (the caller's own repo, e.g. github.repository)"
        required: true
        type: string
      pr_number:
        description: "PR number to evaluate"
        required: true
        type: string
      enabled_classes:
        description: "Comma-separated diff classes this caller opts into (docs-comment,ci-infra,test-only,code-fix). Default: docs-comment only — the original #279 gate's scope, unchanged for callers that don't set this. code-fix additionally requires safe_path_globs + required_checks below (empty ⇒ the class is inert, fail-closed)."
        required: false
        type: string
        default: "docs-comment"
      sensitive_path_patterns:
        description: "Comma-separated regex sources (JS RegExp, matched against each changed file's path) for paths this caller wants excluded from classification entirely — e.g. because a branch-protection gate over those paths can't be independently verified from statusCheckRollup. Default: none."
        required: false
        type: string
        default: ""
      safe_path_globs:
        description: "ops#190 B1, code-fix class ONLY: comma-separated path globs (tiny grammar — ** any depth, * within a segment, ? one char) forming the caller's ALLOWLIST. Every changed file must match at least one glob or the PR is not code-fix. Default empty = the code-fix class is INERT even when enabled (allowlist-primary, fail-closed). The built-in denylist (migrations, SQL, auth/middleware, pricing, Customization/**, .github/**, package manifests) beats this allowlist and is not configurable."
        required: false
        type: string
        default: ""
      required_checks:
        description: "ops#190 B1, code-fix class ONLY: comma-separated check names that must each be strictly SUCCESS on the head commit (SKIPPED/NEUTRAL/PENDING all fail — stricter than the ci-rollup leg's allowlist). Default empty = the named-checks leg fails closed, so code-fix can never merge."
        required: false
        type: string
        default: ""
      train_ready:
        description: "ops#190 rung A2: when true, evaluate the A-side `train:ready` label-authority gate (evaluateTrainReady — human-labeled PRs, GraphQL-attributed authority) instead of the B-side squasher diff-classification gate. The squasher inputs above (enabled_classes / sensitive_path_patterns / safe_path_globs / required_checks) are IGNORED in this mode — the run step passes only --train-ready. Default false: every existing caller keeps exactly its current squasher behavior."
        required: false
        type: boolean
        default: false
    secrets:
      # Optional since 9/06 (Workload Identity Federation): the review leg federates from the
      # caller's OIDC identity (the caller job grants id-token write); a caller may still pass
      # the legacy key during its own migration.
      ANTHROPIC_API_KEY:
        required: false
      FLEET_APP_ID:
        required: true
      FLEET_APP_PRIVATE_KEY:
        required: true
      # ops#260 leg 3: the enroll door's bearer (webhook-router SEAT_INBOX_TOKEN —
      # a second store of the same value, #99). Optional so a caller without it
      # still gates; the gate then prints [enroll-skipped] on every refusal rather
      # than silently dropping the decision line (#464).
      SEAT_INBOX_TOKEN:
        required: false

concurrency:
  group: squasher-automerge-${{ inputs.repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: "Evaluate squasher auto-merge gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ops-pipeline (gate scripts live here, not in the caller repo)
        uses: actions/checkout@v5
        with:
          repository: studio-b-ai/ops-pipeline
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      # ops#250: mint the studiob-fleet-bot installation token (heritage-restart-
      # train sibling pattern). The WHOLE gate run uses it — cross-repo reads
      # (statusCheckRollup incl. checkSuite.workflowRun, GraphQL label attribution)
      # need it anyway, and App-token-caused merge events trigger the target repo's
      # post-merge tripwire + push-to-main workflows, which github.token merges
      # silently suppressed (Rule #38; wr#806 baseline).
      - name: Mint fleet App installation token
        id: mint
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: studio-b-ai

      - name: Fail loud if the mint returned nothing
        if: steps.mint.outputs.token == ''
        run: |
          echo "::error::Fleet App token mint returned an empty token — refusing to evaluate (a github.token fallback would re-arm the Rule #38 event suppression this design exists to kill; see ops#250)."
          exit 1

      - name: "Anthropic federated token (keyless, Kevin 9/06 — the caller job grants id-token write)"
        uses: ./.github/actions/anthropic-federated-token
        with:
          rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

      - name: Run pr-automerge-gate
        working-directory: scripts
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          GATE_REPO: ${{ inputs.repo }}
          GATE_PR_NUMBER: ${{ inputs.pr_number }}
          GATE_ENABLED_CLASSES: ${{ inputs.enabled_classes }}
          GATE_SENSITIVE_PATH_PATTERNS: ${{ inputs.sensitive_path_patterns }}
          GATE_SAFE_PATH_GLOBS: ${{ inputs.safe_path_globs }}
          GATE_REQUIRED_CHECKS: ${{ inputs.required_checks }}
          GATE_TRAIN_READY: ${{ inputs.train_ready }}
          # ops#260 leg 3 — refusal → Kevin's decision block via webhook-router's
          # enroll door. `vars.` resolves in the CALLER's repo (ops-pipeline).
          WEBHOOK_ROUTER_URL: ${{ vars.WEBHOOK_ROUTER_URL }}
          SEAT_INBOX_TOKEN: ${{ secrets.SEAT_INBOX_TOKEN }}
        run: |
          set -euo pipefail
          args=(--repo "$GATE_REPO" --pr "$GATE_PR_NUMBER")
          if [ "$GATE_TRAIN_READY" = "true" ]; then
            # A-side label-authority mode (ops#190 A2): the squasher-only flags are
            # deliberately NOT forwarded — parseArgs treats --train-ready combined
            # with --enabled-classes/--sensitive-path as a caller misconfiguration
            # and throws (mutual exclusion, fail-loud), and enabled_classes has a
            # non-empty DEFAULT, so forwarding it unconditionally would break every
            # train_ready invocation.
            args+=(--train-ready)
          else
            if [ -n "$GATE_ENABLED_CLASSES" ]; then
              args+=(--enabled-classes "$GATE_ENABLED_CLASSES")
            fi
            if [ -n "$GATE_SENSITIVE_PATH_PATTERNS" ]; then
              IFS=',' read -ra patterns <<< "$GATE_SENSITIVE_PATH_PATTERNS"
              for p in "${patterns[@]}"; do
                # Trim whitespace (codex P2 finding, 2026-08-02 pass 2): a
                # caller-friendly "a, b" input splits on comma into "a" and " b"
                # (leading space) — an untrimmed regex source with a leading space
                # would never match a real path, silently making that exclusion
                # entry inert. pr-automerge-gate.ts's own parseArgs ALSO trims
                # (defense-in-depth, single source of truth for correctness), but
                # trimming here too keeps this workflow's own behavior correct
                # independent of the script.
                trimmed="$(echo -n "$p" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                [ -n "$trimmed" ] && args+=(--sensitive-path "$trimmed")
              done
            fi
            # ops#190 B1: same comma-split + trim plumbing as sensitive_path_patterns
            # above (same whitespace hazard, same defense-in-depth — parseArgs trims
            # too). Both inputs default "" so these loops are no-ops for every caller
            # that hasn't opted into the code-fix class.
            if [ -n "$GATE_SAFE_PATH_GLOBS" ]; then
              IFS=',' read -ra globs <<< "$GATE_SAFE_PATH_GLOBS"
              for g in "${globs[@]}"; do
                trimmed="$(echo -n "$g" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                [ -n "$trimmed" ] && args+=(--safe-path-glob "$trimmed")
              done
            fi
            if [ -n "$GATE_REQUIRED_CHECKS" ]; then
              IFS=',' read -ra checks <<< "$GATE_REQUIRED_CHECKS"
              for c in "${checks[@]}"; do
                trimmed="$(echo -n "$c" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                [ -n "$trimmed" ] && args+=(--required-check "$trimmed")
              done
            fi
          fi
          npx tsx pr-automerge-gate.ts "${args[@]}"

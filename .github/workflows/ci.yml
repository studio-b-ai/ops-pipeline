name: CI

# ops-pipeline#25 — this repo had NO CI at all until this file.
#
# All seven pre-existing workflows are scheduled monitors, a rotation job, or the
# reusable auto-merge gate invoked BY OTHER REPOS. None ran on `pull_request`. So the
# 215 tests guarding `pr-automerge-gate.ts` and `automerge-classify.ts` — the logic
# that decides whether other repos' pull requests merge WITHOUT A HUMAN — were never
# enforced. Those tests encode the accumulated codex P1/P2 findings from three review
# passes (the ABA force-push race, binary-file fail-open, header-zone diff parsing,
# paginated file lists, sensitive-path exclusion). Every one of them was defended by a
# test that nothing ran.
#
# Both callers pin this repo `@main`, so a regression reaching `main` here is live for
# the whole fenced fleet immediately, with nothing red anywhere. `main` in this repo IS
# the fleet's production ref for auto-merge policy.
#
# ── Protection state (was "what this file does NOT do") ───────────────────────────
# When this file landed, `main` was not protected at all and this block said so. Both
# halves of #25 have since closed, so the note is corrected here rather than left to
# drift (Rule #235 — the stale line and the fact move together):
#
#   - `"Scripts — typecheck + tests"` IS a required status check on `main`.
#   - `main` requires a PR; force-pushes and deletions are off.
#   - `enforce_admins: true` (Kevin, 2026-08-04) — admins no longer bypass. That
#     includes any agent operating on Kevin's account, which is the point.
#   - `required_approving_review_count: 0`, deliberately: kbibelhausen is the only
#     collaborator and authors every PR, and GitHub forbids self-approval, so
#     requiring 1 would deadlock the repo permanently.
#
# The ordering constraint that block warned about still holds and is why the required
# context could only be added after this file existed: a required context that never
# reports blocks every PR forever (Rules #198/#280). Note `on: pull_request` carries
# NO `paths:` filter — that is load-bearing now, not incidental. Adding one would make
# this check silently absent on PRs that touch no `scripts/` file, and a required
# context that never reports is exactly the permanent block.
#
# ── Proven, not assumed (Rules #322/#464) ─────────────────────────────────────────
# `scripts/tsconfig.json` is new in the same PR and is load-bearing. Without it,
# `tsc --noEmit` runs against ZERO inputs, prints usage text, and exits 0 — a check
# that has never checked anything (Rule #382). That exact false-green is what led to
# #25 being filed. Before shipping, a deliberate type error was planted and the
# typecheck returned exit 2; with it removed, exit 0. Both directions.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: "Scripts — typecheck + tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # `npm ci` deliberately, NOT `npm install`: ci installs the LOCKFILE exactly and
      # fails loudly on package.json/lock drift, which is the whole point of a
      # verification job (Rule #289). The reusable gate workflow's `npm ci || npm
      # install` fallback is for RUNTIME resilience; a check that silently repairs its
      # own inputs cannot detect that they were broken.
      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  cfo_brief_regression:
    name: "CFO brief — July classification regression"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The classifier ships as a verbatim copy of the seat-proven ruleset
      # (penny-exact on July 2026, codex-hardened). This gate asserts the
      # committed July fixture still classifies to the EXACT adopted model-v2
      # totals — any change that moves a penny of the solved month fails here.
      # Python stdlib only; not a required context on main (the Scripts job
      # holds that role) but red here blocks merge by fleet convention.
      - name: "July fixture must reproduce the adopted totals"
        run: python3 scripts/cfo-brief/test_july_regression.py

      # CashSale revenue stream (#106): the June 2026 CSL-bearing month must
      # reproduce the seat-verified authoritative totals exactly (income,
      # combined leg6, combined grand total), the August 2025 exclusion
      # mechanism must never silently drop a non-income cash-movement line,
      # and July's CSL slice must stay empty (the reason its fixture alone
      # never caught this class). Python stdlib only.
      - name: "CashSale fixtures must reproduce the adopted totals"
        run: python3 scripts/cfo-brief/test_csl_regression.py

name: secret-scan
# Fleet secret-scan guard (CLAUDE.md Rule #363; ops-pipeline#129).
#
# Reusable `workflow_call` twin of bolt-wms/.github/workflows/gitleaks.yml — the
# ONE real guard the 2026-08-16 fleet sweep found across 60 repos. Scans the
# caller's WORKING TREE (dir mode), not git history: rotated historical secrets
# stay dead in history without noise; any secret present in checked-in files
# fails the build. Version bumps and rule changes live HERE, once.
#
# Config resolution (in order):
#   1. caller repo `.gitleaks.toml` at the repo root (bolt-wms / client-asthetik
#      keep theirs), else
#   2. the canonical config embedded below (default gitleaks rules + the two
#      custom rules born of the 2026-07-10 api-bot incident — the default rules
#      did NOT catch that credential; verified. Do not drop them without
#      re-running that verification).
# Fingerprints: the caller's root `.gitleaksignore` (gitleaks reads it from the
# scan root automatically; `file:rule:LINE`, line-pinned — re-pin on line shift).
#
# Caller shape (per repo, PR + push-to-main):
#   jobs:
#     gitleaks:
#       uses: studio-b-ai/ops-pipeline/.github/workflows/secret-scan.yml@main
#
# Rule #464/#471 ship contract: the first caller in every repo gets BOTH
# verdicts planted (a known-bad commit → RED, reverted → GREEN) before the
# check is made REQUIRED on main.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "gitleaks release to pin (linux x64 tarball)"
        type: string
        required: false
        default: "8.30.1"
  workflow_dispatch: {}   # self-test on ops-pipeline itself (same job, this repo's tree)

permissions:
  contents: read

jobs:
  gitleaks:
    name: "Secret scan (gitleaks, Rule 363)"
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: ${{ inputs.gitleaks-version || '8.30.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Install gitleaks (pinned, outside the scanned tree)"
        # curl → tar via a pipe is unsafe: without -f, curl exits 0 on a 4xx
        # release-CDN error page and streams HTML into tar. Download to a file
        # first, fail on HTTP errors, retry transient CDN hiccups. Install into
        # RUNNER_TEMP so the binary never lands inside the tree being scanned.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -fsSL \
            --retry 5 --retry-delay 3 --retry-all-errors --retry-connrefused \
            -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          rm -f "$RUNNER_TEMP/gitleaks.tgz"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      - name: "Resolve config (repo-local .gitleaks.toml, else canonical)"
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            echo "path=.gitleaks.toml" >> "$GITHUB_OUTPUT"
            echo "source=repo-local .gitleaks.toml" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CFG="$RUNNER_TEMP/gitleaks-canonical.toml"
          cat > "$CFG" <<'TOML'
          # Canonical Studio B gitleaks config (ops-pipeline secret-scan.yml; twin of bolt-wms/.gitleaks.toml)
          title = "studio-b-ai canonical gitleaks config"

          [extend]
          useDefault = true

          [[rules]]
          id = "hardcoded-password-assignment"
          description = "Password/passwd/pwd assigned a string literal (env reads and placeholders excluded)"
          regex = '''(?i)[\w.-]{0,32}(password|passwd|pwd)\b['"]?\s*[=:]\s*['"]([^'"\s\$<>{}]{8,})['"]'''
          keywords = ["password", "passwd", "pwd"]
          [rules.allowlist]
          regexTarget = "match"
          regexes = [
            '''(?i)(example|placeholder|changeme|your-|redacted|dummy|fake|test|mock|sample|xxxx|\*\*\*)''',
            '''process\.env|os\.environ|getenv|import\.meta\.env''',
          ]

          [[rules]]
          id = "hardcoded-railway-token"
          description = "Railway token env name assigned a UUID literal, including shell default-fallback form"
          regex = '''(?i)railway[_-]?token["']?\s*[=:].{0,24}[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
          keywords = ["railway"]
          TOML
          echo "path=$CFG" >> "$GITHUB_OUTPUT"
          echo "source=canonical (embedded in ops-pipeline secret-scan.yml)" >> "$GITHUB_OUTPUT"

      - name: "Scan working tree"
        shell: bash
        run: |
          set -uo pipefail
          echo "config: ${{ steps.cfg.outputs.source }}"
          [ -f .gitleaksignore ] && echo "fingerprints: .gitleaksignore ($(grep -cvE '^\s*(#|$)' .gitleaksignore || true) pins)" || echo "fingerprints: none"
          REPORT="$RUNNER_TEMP/gitleaks-report.json"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir . \
            --config "${{ steps.cfg.outputs.path }}" \
            --no-banner --redact --exit-code 1 \
            --report-format json --report-path "$REPORT"
          rc=$?
          {
            echo "## Secret scan (gitleaks ${GITLEAKS_VERSION}, dir mode)"
            echo ""
            echo "- config: ${{ steps.cfg.outputs.source }}"
            if [ "$rc" -eq 0 ]; then
              echo "- result: **clean**"
            else
              echo "- result: **LEAKS FOUND (rc=$rc)** — fingerprints below (secrets redacted). Real secret → rotate + remove; benign → pin \`file:rule:line\` in \`.gitleaksignore\` with a review-basis note in the PR."
              echo ""
              if [ -s "$REPORT" ]; then
                python3 - "$REPORT" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          print("| fingerprint (file:rule:line) | description |")
          print("|---|---|")
          for r in rows:
              print(f"| `{r.get('File')}:{r.get('RuleID')}:{r.get('StartLine')}` | {r.get('Description','')} |")
          PY
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

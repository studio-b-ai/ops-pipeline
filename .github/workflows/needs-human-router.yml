name: Needs-human router (reusable)

# ops-pipeline#66 chip A — design comment: CTO seat, 2026-08-14 ~03:45Z, issue #66
# comment 5289224655. Kevin's ruling: "auto-route immediately" — the reaction is a
# BRAKE (👎), never a gate. See scripts/needs-human-router.ts for the full design
# rationale (main pass + recall pass, metering, marker-deduped receipts).
#
# This is the REUSABLE half, mirroring needs-human-probe.yml / squasher-automerge.yml's
# house-pattern architecture: thin per-repo cron callers `uses:` this workflow so the
# router logic stays central in ops-pipeline. No centralized cross-repo write credential
# exists (verified in the design comment — no fleet GitHub App is wired), so this
# workflow runs entirely against the CALLER's own repo, using the CALLER's own ambient
# GITHUB_TOKEN (`github.token` resolves in the caller's job context on a workflow_call,
# not ops-pipeline's) — zero new credentials, matching #66's chip-A scope. Cross-repo
# routing HOLDS in v1 rather than acting (Rule #184: no cross-repo writes).
#
# Chip B (5 repos) adds the per-repo hourly cron callers + the 2 probe callers
# (webhook-router, asthetik-trade-theme) that this workflow depends on for coverage —
# NOT part of this PR.
#
# stint #944 (mechanic crew, 2026-09-29): the router now also fires the probe inline
# when an escalated issue has no findings comment ("no-probe" disposition). This
# covers the gap where machinery (the sweep worker) labels issues with an App
# installation token — GitHub may not fire the `issues: labeled` workflow trigger for
# non-user-token label events, so the probe workflow never runs and the router used to
# park such issues as "no-probe" forever. The router now calls runProbe() directly
# from needs-human-probe.ts. Anthropic federation was added to this workflow to
# support that inline probe call; the ANTHROPIC_API_KEY secret input covers callers
# that haven't migrated to federation yet.

on:
  workflow_call:
    inputs:
      repo:
        description: "owner/repo to route needs-human issues in (the caller's own repo)"
        required: true
        type: string
      dry_run:
        description: "Real gh reads throughout (including org-membership checks), zero mutations — preview only"
        required: false
        type: boolean
        default: false
    secrets:
      # ops-pipeline#317 / #320: the seat-inbox door's bearer (webhook-router
      # SEAT_INBOX_TOKEN — a SECOND STORE of the same value in webhook-router's Railway
      # env, Rule #99: rotate atomically across BOTH stores or one 401s while the other
      # works). Optional so a caller without it still routes; the hold-rail leg then
      # prints [rail-skipped] on every hold rather than silently dropping the board
      # line (Rule #464: a deployment gap must be visible). WEBHOOK_ROUTER_URL is a
      # `vars.` in ops-pipeline (the public hostname, not a secret); see the run step.
      SEAT_INBOX_TOKEN:
        required: false
      # stint #944: the router now fires the probe inline when machinery-labeled
      # issues were parked no-probe. Optional so callers still route without it;
      # the probe leg logs a failure and retries next run. Callers that federate
      # (OIDC) don't need this — the federation step below exchanges the identity
      # token. The probe workflow already supports both modes.
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read
  issues: write
  id-token: write   # WIF — stint #944: router now fires the probe inline when an issue
                    # was labeled by machinery (no user-token label event triggers the
                    # probe workflow). The probe needs Anthropic federation.

# One router run at a time per repo: an hourly cron racing a slow prior run (or a
# manual workflow_dispatch) must not double-process the same issues.
concurrency:
  group: needs-human-router-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  route:
    name: "Route needs-human issues"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ops-pipeline (router scripts live here, not in the caller repo)
        uses: actions/checkout@v5
        with:
          repository: studio-b-ai/ops-pipeline
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: "Anthropic federated token (stint #944 — router fires probe inline on no-probe issues)"
        uses: ./.github/actions/anthropic-federated-token
        with:
          rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

      - name: Run needs-human router
        working-directory: scripts
        env:
          # The CALLER's own ambient token — this workflow runs IN the caller's repo
          # context via workflow_call, so github.token here is scoped to inputs.repo
          # with the issues:write permission the caller's own workflow file grants.
          # ops-pipeline's own issues:write (declared above) covers this workflow's
          # OWN checkout/run; the actual issue mutations land in inputs.repo because
          # every gh call in needs-human-router.ts is explicitly --repo-qualified.
          #
          # UNVERIFIED (codex review pass 3, 2026-08-14 — see lib/github-issues.ts's
          # isOrgMember doc comment for the full writeup): this GITHUB_TOKEN also gates
          # the 👎-authorization org-membership check, and whether a repo-scoped
          # installation token can see PRIVATE org membership for an arbitrary login is
          # genuinely uncertain without a live fire. The design comment's own plant
          # ladder (issue #66: "second planted issue with org-member 👎 -> close-as-
          # rejected") is the first real signal on this — if that planted 👎 does NOT
          # get honored, the fix is a Kevin-gated read:org-scoped PAT passed as a
          # secret here, not more client-side logic.
          GH_TOKEN: ${{ github.token }}
          # ops-pipeline#317 / #320 hold-rail leg — the router POSTs
          # /internal/seat-inbox on every HOLD_RECEIPT_MARKER to rail Dispatcher (+
          # every lane:<seat> seat) so `/yard` sees the hold the same hour. Both are
          # OPTIONAL: hold-rail fails visibly ([rail-skipped]) when unconfigured, so
          # ordinary routing keeps working while callers roll the plumbing out
          # (Rule #464 — a gap must be visible in every run until someone fixes it).
          # `vars.WEBHOOK_ROUTER_URL` resolves in the CALLER's repo, same as the
          # squasher-automerge/gate-enroll pattern.
          WEBHOOK_ROUTER_URL: ${{ vars.WEBHOOK_ROUTER_URL }}
          SEAT_INBOX_TOKEN: ${{ secrets.SEAT_INBOX_TOKEN }}
          # stint #944 — router fires probe inline on no-probe issues.
          # Optional (the federation step above covers OIDC callers); pass
          # the API key for callers that haven't migrated to federation yet.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx needs-human-router.ts --repo "${{ inputs.repo }}" ${{ inputs.dry_run && '--dry-run' || '' }}

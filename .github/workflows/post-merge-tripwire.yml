# post-merge-tripwire.yml — reusable post-merge 5xx tripwire (ops-pipeline#190 B2;
# design of record docs/plans/2026-08-28-automerge-b-plus-a-v2.md §4.2).
#
# Fires AFTER an automerged code-fix PR lands: re-derives the code-fix verdict
# server-side (the `automerge:code-fix` label on the caller side is a FILTER, not
# authority), binds the squash sha to exactly one Railway deployment, waits out a
# 10-minute health window from SUCCESS, and on sustained 5xx auto-OPENS a revert PR
# (never auto-merged — Rule #97) plus a machinery-lane escalation issue (Rule #165).
# All operational failure modes exit 0 with an escalation issue as the alarm; the
# job only goes red on input-contract violations (bad inputs, PR not merged, sha
# mismatch).
#
# Caller wiring (per-repo, B3 enable ladder):
#
#   on:
#     pull_request:
#       types: [closed]
#   jobs:
#     tripwire:
#       if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'automerge:code-fix')
#       permissions:
#         contents: write        # revert branch push (github.token fallback path)
#         pull-requests: write   # revert PR + receipt comments
#         issues: write          # escalation issues
#       uses: studio-b-ai/ops-pipeline/.github/workflows/post-merge-tripwire.yml@main
#       with:
#         repo: ${{ github.repository }}
#         pr_number: ${{ github.event.pull_request.number }}
#         merge_sha: ${{ github.event.pull_request.merge_commit_sha }}
#         closed_at: ${{ github.event.pull_request.closed_at }}
#         project_id: <railway project uuid>
#         environment_id: <railway environment uuid>
#         service_id: <railway service uuid>
#         safe_path_globs: |
#           src/**
#           scripts/**
#         required_checks: |
#           Build & Check
#           gitleaks / Secret scan (gitleaks, Rule 363)
#       secrets:
#         RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
#         FLEET_APP_ID: ${{ secrets.FLEET_APP_ID }}
#         FLEET_APP_PRIVATE_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
#
# Rule #38: reusable workflows do NOT inherit caller secrets — the caller's
# `secrets:` block above is load-bearing. Repo→Railway-service mapping lives in the
# CALLER's `with:` block (workflow inputs, not a central manifest) so each B3 rung
# is one self-contained caller file.
#
# Token strategy: FLEET_APP_ID/FLEET_APP_PRIVATE_KEY are OPTIONAL. When present, an
# App installation token checks out the target repo and creates the revert PR, so
# the revert PR's own CI fires (GITHUB_TOKEN-created PRs trigger NO workflows —
# Rule #303's close/reopen dance is the degraded fallback, and the runner's revert
# PR body notes it). When absent, github.token is used and the caller must grant
# the permissions shown above.
#
# Checked out at @main, not @v1 — same deliberate canary posture as
# squasher-automerge.yml; graduation to the v1 tag is a controller decision.

name: post-merge-tripwire

on:
  workflow_call:
    inputs:
      repo:
        description: "Target repo as owner/name (the repo whose PR merged)"
        required: true
        type: string
      pr_number:
        description: "Merged PR number in the target repo"
        required: true
        type: string
      merge_sha:
        description: "Squash merge commit sha (event.pull_request.merge_commit_sha)"
        required: true
        type: string
      closed_at:
        description: "PR closed timestamp, ISO-8601 (event.pull_request.closed_at)"
        required: true
        type: string
      project_id:
        description: "Railway project id (UUID)"
        required: true
        type: string
      environment_id:
        description: "Railway environment id (UUID)"
        required: true
        type: string
      service_id:
        description: "Railway service id (UUID) for the service this repo deploys"
        required: true
        type: string
      safe_path_globs:
        description: "Newline-separated safe-path globs for the code-fix re-derivation (empty = refuse everything, fail-closed)"
        required: false
        type: string
        default: ""
      sensitive_path_patterns:
        description: "Newline-separated sensitive-path regex deny patterns"
        required: false
        type: string
        default: ""
      required_checks:
        description: "Newline-separated required check names the merged PR's rollup must satisfy (empty = fail-closed refuse). Newline-delimited because real check names contain commas (e.g. 'gitleaks / Secret scan (gitleaks, Rule 363)')"
        required: false
        type: string
        default: ""
    secrets:
      RAILWAY_API_TOKEN:
        description: "Railway API token for deployment + HTTP-metrics reads"
        required: true
      FLEET_APP_ID:
        description: "studiob-fleet-bot App id (optional — enables revert PRs that trigger CI)"
        required: false
      FLEET_APP_PRIVATE_KEY:
        description: "studiob-fleet-bot App private key (optional, pairs with FLEET_APP_ID)"
        required: false

concurrency:
  group: post-merge-tripwire-${{ inputs.repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  tripwire:
    runs-on: ubuntu-latest
    # Worst case ≈ 15 min attribution + 30 min SUCCESS wait + 10 min window +
    # settle/overhead ≈ 60 min; 75 leaves margin without masking a hang (#356).
    timeout-minutes: 75
    env:
      # secrets are not available in step `if:` expressions — env indirection is
      # the sanctioned presence check for the optional App credentials. The key's
      # presence is checked via a boolean expression so no key material ever
      # lands in env; the mint step requires BOTH (codex P2, 2026-08-30 pass 1:
      # ID-without-key would fail the mint step before the runner could escalate
      # or fall back — a red job on a closed-PR event nobody watches).
      FLEET_APP_ID: ${{ secrets.FLEET_APP_ID }}
      FLEET_APP_KEY_SET: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Check out ops-pipeline (tripwire scripts)
        uses: actions/checkout@v4
        with:
          repository: studio-b-ai/ops-pipeline
          ref: main

      - name: Mint fleet App installation token
        id: mint
        if: env.FLEET_APP_ID != '' && env.FLEET_APP_KEY_SET == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: studio-b-ai

      - name: Resolve target-repo token
        id: token
        env:
          MINTED: ${{ steps.mint.outputs.token }}
          FALLBACK: ${{ github.token }}
        run: |
          if [ -n "$MINTED" ]; then
            echo "value=$MINTED" >> "$GITHUB_OUTPUT"
            echo "Using fleet App installation token (revert PRs will trigger CI)."
          else
            if [ -n "$FLEET_APP_ID" ] && [ "$FLEET_APP_KEY_SET" != "true" ]; then
              echo "::warning::FLEET_APP_ID is set but FLEET_APP_PRIVATE_KEY is not — App credentials must be configured as a pair. Falling back to github.token."
            fi
            echo "value=$FALLBACK" >> "$GITHUB_OUTPUT"
            echo "::notice::No usable fleet App credentials — falling back to github.token. A revert PR created this way triggers NO workflows (close/reopen it to fire checks; Rule #303)."
          fi

      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ steps.token.outputs.value }}
          path: target-repo
          # Deep enough that the squash commit is usually present already; the
          # runner also runs `git fetch --depth=2 origin <sha>` as a backstop.
          fetch-depth: 50

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci || npm install

      - name: Run post-merge tripwire
        working-directory: scripts
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          T_REPO: ${{ inputs.repo }}
          T_PR: ${{ inputs.pr_number }}
          T_MERGE_SHA: ${{ inputs.merge_sha }}
          T_CLOSED_AT: ${{ inputs.closed_at }}
          T_PROJECT_ID: ${{ inputs.project_id }}
          T_ENVIRONMENT_ID: ${{ inputs.environment_id }}
          T_SERVICE_ID: ${{ inputs.service_id }}
          T_SAFE_GLOBS: ${{ inputs.safe_path_globs }}
          T_SENSITIVE: ${{ inputs.sensitive_path_patterns }}
          T_REQUIRED_CHECKS: ${{ inputs.required_checks }}
        run: |
          set -euo pipefail
          args=(
            --repo "$T_REPO"
            --pr "$T_PR"
            --merge-sha "$T_MERGE_SHA"
            --closed-at "$T_CLOSED_AT"
            --project-id "$T_PROJECT_ID"
            --environment-id "$T_ENVIRONMENT_ID"
            --service-id "$T_SERVICE_ID"
            --target-dir "$GITHUB_WORKSPACE/target-repo"
          )
          # Newline-split + trim each repeatable input. NOT comma-split: real
          # check names contain commas ("gitleaks / Secret scan (gitleaks, Rule
          # 363)") — a comma delimiter would shear that into two never-matching
          # names and fail-closed refuse every run (#464 inert-guard shape).
          # Blank lines drop; parseTripwireArgs trims again behind this.
          if [ -n "$T_SAFE_GLOBS" ]; then
            while IFS= read -r g; do
              trimmed="$(printf '%s' "$g" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -n "$trimmed" ] && args+=(--safe-path-glob "$trimmed")
            done <<< "$T_SAFE_GLOBS"
          fi
          if [ -n "$T_SENSITIVE" ]; then
            while IFS= read -r p; do
              trimmed="$(printf '%s' "$p" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -n "$trimmed" ] && args+=(--sensitive-path "$trimmed")
            done <<< "$T_SENSITIVE"
          fi
          if [ -n "$T_REQUIRED_CHECKS" ]; then
            while IFS= read -r c; do
              trimmed="$(printf '%s' "$c" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -n "$trimmed" ] && args+=(--required-check "$trimmed")
            done <<< "$T_REQUIRED_CHECKS"
          fi
          npx tsx post-merge-tripwire.ts "${args[@]}"

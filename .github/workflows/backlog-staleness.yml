name: Backlog Staleness

# ops-pipeline#136 (CTO seat -> CoS, LANES rule 17 rollout, Kevin word 2026-08-16) -- the
# daily fleet instrument for rule 17(d)'s per-manager backlog-staleness stall check. Full
# design lives in scripts/backlog-staleness-worker.ts's and
# scripts/lib/backlog-staleness-lib.ts's header comments; this workflow only mints the
# fleet App token (repo-hygiene.yml's pattern, copied verbatim) and runs the worker with
# it.
#
# Fleet App token required for the SAME reason as repo-hygiene.yml: this worker reads open
# issues across MULTIPLE org repos (scripts/backlog-managers.yaml's repo list), which a
# repo-scoped ambient GITHUB_TOKEN structurally cannot do -- it only sees the one repo a
# workflow runs in. studiob-fleet-bot's installation-level issues:write + metadata:read
# covers every read (issue list, label list) and every write (open/retitle/comment/close
# the per-manager aggregate issue, always on studio-b-ai/ops-pipeline itself) this worker
# performs.
#
# Unlike repo-hygiene.yml (which never mutates a REPO), this worker DOES open/retitle/
# comment/close ISSUES -- but only ever on ops-pipeline itself, never on a manager's own
# repo (Rule #165 auto-reconciled alerting: the open-issue set per manager IS the dedup
# state).

on:
  schedule:
    - cron: "0 12 * * *" # daily, 12:00 UTC (8 AM ET) -- GH Actions cron is UTC-only (Rule #94)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Real reads throughout (every configured repo's issue list + label list) -- zero issue mutations on ops-pipeline, preview only"
        required: false
        type: boolean
        default: true
      now:
        description: "ISO 8601 timestamp overriding the clock (the #464/#471 plant ladder) -- omit for the real current time"
        required: false
        type: string
        default: ""
      repos:
        description: "Comma-separated repo allowlist (e.g. studio-b-ai/ops-pipeline) to scope this run to a subset of backlog-managers.yaml's repos -- omit for the full fleet"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: backlog-staleness
  cancel-in-progress: false

jobs:
  sweep:
    name: "Backlog staleness -- rule 17 instrument (fleet App token)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: "Install deps"
        working-directory: scripts
        run: npm ci || npm install

      # Minted UNCONDITIONALLY -- including on a dry run: Rule #376, a dry run that reads
      # nothing proves nothing, and every read this worker does (per-repo issue list, per-repo
      # label list) needs real org-wide access the ambient GITHUB_TOKEN structurally cannot
      # provide.
      - name: "Mint fleet installation token"
        id: mint
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: studio-b-ai

      - name: "Fail loud if the fleet token did not mint"
        if: steps.mint.outputs.token == ''
        run: |
          echo "::error::actions/create-github-app-token produced no token -- check the FLEET_APP_ID / FLEET_APP_PRIVATE_KEY secrets and the studiob-fleet-bot App's org installation." >&2
          exit 1

      # Codex pass-1 P1: the previous version interpolated ${{ inputs.now }} / ${{ inputs.repos
      # }} (free-text workflow_dispatch strings) DIRECTLY into this run: block's shell source
      # via format(...) -- GitHub Actions substitutes ${{ }} expressions into the script TEXT
      # before the shell ever runs, so a dispatcher-supplied value containing `$(...)`,
      # backticks, or `;` would execute as shell syntax with the just-minted fleet App token
      # live in GH_TOKEN. Untrusted string inputs now travel through env: (real OS-level env
      # vars, never text-substituted into the script) and are referenced quoted ("$NOW_INPUT")
      # -- a variable's VALUE is inert data to the shell even if that value itself looks like
      # shell syntax. `dry_run` stays a direct ${{ }} substitution because it's a boolean-typed
      # input -- GitHub Actions can only ever produce the literal string '--dry-run' or '' from
      # that expression, so there's no attacker-controlled text flowing through it.
      - name: "Run backlog-staleness worker"
        id: run_worker
        working-directory: scripts
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          DRY_RUN_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          NOW_INPUT: ${{ inputs.now }}
          REPOS_INPUT: ${{ inputs.repos }}
        run: |
          args=()
          if [ -n "$DRY_RUN_FLAG" ]; then args+=("--dry-run"); fi
          if [ -n "$NOW_INPUT" ]; then args+=(--now "$NOW_INPUT"); fi
          if [ -n "$REPOS_INPUT" ]; then args+=(--repos "$REPOS_INPUT"); fi
          npx tsx backlog-staleness-worker.ts "${args[@]}"

      # Rule #356: a timeout kill reports "cancelled" SILENTLY unless a SEPARATE if: always()
      # step names the terminal status explicitly.
      - name: "Report terminal status"
        if: always()
        run: |
          echo "backlog-staleness workflow terminal status: ${{ job.status }} (run_worker outcome: ${{ steps.run_worker.outcome }})"

name: Repo Hygiene

# ops-pipeline#101 (design comment: CTO seat, 2026-08-14) — the recurring flags-only
# fleet-drift-vs-baseline worker. Full design lives in scripts/repo-hygiene-worker.ts's
# and scripts/lib/repo-hygiene-lib.ts's header comments; this workflow only mints the
# fleet App token (needs-human-crossrepo.yml's pattern, copied verbatim per ops#88) and
# runs the worker with it.
#
# Why minting is required here (most of this repo's other monitors use the ambient
# GITHUB_TOKEN directly — see credential-expiry-monitor.yml / gateway-token-watch.yml):
# this worker enumerates EVERY repo in the studio-b-ai org (`gh repo list studio-b-ai`) —
# a repo-scoped ambient token structurally cannot do that, it can only see the one repo
# the workflow is running in. The `studiob-fleet-bot` App (App ID 4595770, installed
# org-wide — see ops-pipeline#88) is what makes an org-wide read possible; its
# installation-level `issues:write` is also what lets this workflow open/update/close the
# aggregate drift issue in THIS repo with no job-level `issues: write` permission of its
# own.
#
# ⚠️ Live-verified 2026-08-14 (`gh api /orgs/studio-b-ai/installations`): the fleet App's
# CURRENT installation permissions are exactly `issues:write` + `metadata:read` — no
# `contents:read`. That's enough for the org enumeration leg (Metadata covers `GET
# /orgs/{org}/repos`) but NOT the bot-churn commit-history leg (`GET
# /repos/{owner}/{repo}/commits` requires Contents:read per GitHub's own
# permissions-required-for-github-apps docs). The worker degrades gracefully and says so
# loudly (both in this workflow's run log and in the issue body) rather than silently
# reporting 0 bot-churn findings forever — see repo-hygiene-worker.ts's file header for
# the full account. Granting Contents:read is an org-owner-UI-only action (no API path,
# mirrors Rule #78's `workflows:` permission story) and is OUT OF SCOPE for this PR —
# flagged as a top-level follow-up (Rule #6).
#
# Flags-only (the issue's own "Law" section): this workflow, and the worker it runs,
# never mutate a repo, never archive anything, never touch repo-baseline.json. Baseline
# updates are human — the issue body carries the exact line(s) to edit.
#
# ops-pipeline#277 (2026-09-04) added a THIRD leg, required-checks-drift-worker.ts (design
# in scripts/lib/required-checks-drift-classify.ts's header) — dead branch-protection
# required-check contexts + unparseable workflow YAML, riding the SAME minted fleet-App
# token as the two legs above. It needs Administration:read (branch-protection reads) —
# the ONLY missing grant: a live probe 9/04 18:4xZ (`gh api orgs/studio-b-ai/installations`)
# shows the fleet App already holds contents=write + actions=write + checks=read; the
# 'Contents/Actions gap' wording that used to sit here was a stale carry (#412). Flags-only,
# degrades loudly per Rule #464 rather than failing the job. See that step's comment below.

on:
  schedule:
    - cron: "0 9 * * 5" # weekly, Friday 09:00 UTC (GH Actions cron is UTC-only — Rule #94)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Real reads throughout (org enumeration, per-repo commit fetch, issue list) — zero issue mutations, preview only"
        required: false
        type: boolean
        default: false

# Job-level permissions cover ONLY this job's own checkout via the ambient GITHUB_TOKEN.
# Every actual mutation (issue open/edit/close in THIS repo) rides the MINTED fleet
# installation token (GH_TOKEN below), never this ambient token — if the mint step ever
# failed silently and a later step fell back to `github.token`, that token has no issues
# permission at all here, so every `gh` call would fail loud rather than quietly mutate
# under the wrong identity.
permissions:
  contents: read

concurrency:
  group: repo-hygiene
  cancel-in-progress: false

jobs:
  sweep:
    name: "Fleet drift vs baseline (fleet App token)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      # Minted UNCONDITIONALLY — including on a dry run: Rule #376, a dry run that reads
      # nothing proves nothing, and every read this worker does (org repo enumeration,
      # per-repo commit fetch, issue list) needs real org-wide access the ambient
      # GITHUB_TOKEN structurally cannot provide.
      - name: Mint fleet installation token
        id: mint
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: studio-b-ai

      - name: Fail loud if the fleet token did not mint
        if: steps.mint.outputs.token == ''
        run: |
          echo "::error::actions/create-github-app-token produced no token — check the FLEET_APP_ID / FLEET_APP_PRIVATE_KEY secrets and the studiob-fleet-bot App's org installation." >&2
          exit 1

      - name: Run repo-hygiene worker
        working-directory: scripts
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: npx tsx repo-hygiene-worker.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      # ops-pipeline#112 — the dead-cron detector leg (scripts/dead-cron-worker.ts; design
      # in scripts/lib/dead-cron-classify.ts's header). Separate step, separate failure
      # domain: `!cancelled()` (Rule #320 — a bare sequential step inherits an implicit
      # success(), so a fleet-drift failure above would otherwise silently skip this leg;
      # tonight's whole triage exists because exactly that class of skip went unwatched).
      # If the mint step failed, GH_TOKEN is empty and this fails loud — never quietly
      # mutates under the ambient token (which has no issues permission here anyway).
      #
      # ⚠️ Until the ops#104 grant (Actions:read + Contents:read on the fleet App), this
      # step's reads 403 systemically in CI — by design it then files/refreshes ONE
      # degradation self-issue on ops-pipeline naming the gap, and skips the close sweep.
      # It does NOT fail the job: a documented-degraded run is the honest steady state
      # until the grant, not an error (Rule #464 — the blindness is loud, not silent).
      - name: Run dead-cron worker
        if: ${{ !cancelled() }}
        working-directory: scripts
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: npx tsx dead-cron-worker.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      # ops-pipeline#277 — the required-checks-drift leg (scripts/required-checks-drift-
      # worker.ts; design in scripts/lib/required-checks-drift-classify.ts's header). Third
      # independent leg, third independent failure domain: `!cancelled()` (Rule #320) so a
      # fleet-drift or dead-cron failure above never silently skips this one.
      #
      # ⚠️ EXPECTED DEGRADATION UNTIL ONE GRANT LANDS: this leg needs Administration:read
      # (branch-protection reads) on the fleet App's org installation — the only permission
      # it lacks (Contents + Actions are already granted at write; live probe 9/04 18:4xZ).
      # By design it does NOT fail the job
      # — it opens/updates its two aggregate issues carrying loud `systemicFailures` notes
      # (Rule #464) and exits 0, exactly like the dead-cron leg's own degraded-but-honest
      # steady state until the ops#104-class grant lands (org Settings → GitHub Apps →
      # studiob-fleet-bot, UI-only, no API path).
      - name: Run required-checks-drift worker
        if: ${{ !cancelled() }}
        working-directory: scripts
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: npx tsx required-checks-drift-worker.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

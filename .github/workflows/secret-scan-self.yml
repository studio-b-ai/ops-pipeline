name: secret-scan-self
# ops-pipeline's own caller of the reusable secret-scan workflow (Rule #363).
# First rung of the ops#129 rollout ladder (#169): this repo was locally clean
# on 2026-08-16, so it proves the reusable job on a clean tree — and every PR
# here that touches secret-scan.yml exercises the new version before any
# other repo consumes it (@main).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/secret-scan.yml

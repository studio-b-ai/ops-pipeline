    type: 1password-sa
    op_ref: "op://Studio B Infrastructure/op-sa-acuops-hub/credential"
    recorded_expiry: null                # re-minted 2026-08-27 as SA `acuops-hub-perm` WITHOUT `--expires-in`
                                         #   (ops-pipeline#135 item 1b, CTO-run mint sitting). Receipts: store↔1P
                                         #   sha256-aligned (#99/#454), vault read-probe + blast-radius PASS (#322),
                                         #   acuops-hub redeploy SUCCESS 2026-08-28T02:54Z. Old SA `acuops-hub-2026-08`
                                         #   left to self-expire 2026-11-14.
    non_expiring: true
    owner: cto                           # rung 2 = the CTO's monitor + revoke-on-signal; no Kevin mint cadence
    keyless_alternative: null            # SA tokens have no keyless form yet
    target_rung: 2
    rung_by: "AT rung 2 since 2026-08-27 (ops-pipeline#135 item 1b executed)"


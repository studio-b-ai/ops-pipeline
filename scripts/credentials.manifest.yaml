    recorded_expiry: "2027-07-31"        # minted 2026-07-31 (1yr, Kevin); consumed as GITHUB_ISSUES_TOKEN on Railway bolt-wms
    owner: cto                           # scope: studio-b-ai/bolt-wms ONLY, Issues RW + Metadata R (machinery-alert issue lane, bolt#1368)
    keyless_alternative: "GitHub App installation token (studiob-fleet-bot, App 4595770 / installation 153748636)"
    target_rung: 0                       # FIRST MIGRATION of the 2026-08-17 decision (D3): bolt src/lib/github-issues.ts
                                         #   → App-token-first with this PAT as the fallback; once the planted receipt
                                         #   (issue opened+closed by studiob-fleet-bot[bot]) lands, the PAT var is UNSET
                                         #   and this entry is REMOVED (revoke = Kevin, annual sitting)
    rung_by: "2026-08-21"

  # LMMI_REPO_PAT — NOT in the "Studio B Infrastructure" vault as of the 2026-06-10 reconciliation
  # (live-verified: the SA enumerated the vault and there is no such item; it lives only in Railway
  # env + GH Actions secrets per Rule #99). To monitor it, add the PAT as a 1P item in this vault,
  # then restore the block below (the github-pat-finegrained probe reads the real expiry header live):

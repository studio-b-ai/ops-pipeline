# Credential Expiry Monitor — manifest (CLAUDE.md Rule #302)
#
# Inventory RECONCILED 2026-06-10 against a fleet-wide publish/secret audit. The npm/PyPI publish
# surface is fully KEYLESS (clients + acumatica-lint on OIDC; GH-Packages on ephemeral GITHUB_TOKEN),
# so NO publish token is monitored — see scripts/CREDENTIAL-MONITOR.md § "Inventory follow-ups".
# ⚠️ STILL GATE #2: verify each `op_ref` below against the REAL "Studio B Infrastructure" 1Password
#    item names (this file was authored WITHOUT Infra-vault access). A wrong ref surfaces as
#    PROBE_FAILED (a flagged gap), never a silent miss.
#
# This file holds ONLY op:// references + non-secret metadata — NEVER a credential value.
# At runtime the monitor reads each value via the read-only Infra-vault Service Account
# (OP_SERVICE_ACCOUNT_INFRA) and runs an ACTIVE probe for the credential's REAL expiry /
# aliveness (Rule #302 — not the recorded date).
#
# Per-item fields:
#   name                 unique label (used in alerts + dedup key)
#   type                 1password-sa | npm-granular | github-pat-finegrained
#                        | entra-client-secret | entra-user-password | cloudflare-api-token | tls-cert
#   op_ref               op:// reference to the value (all types except entra/tls) — OR the
#                        self-probe scheme `env:<VAR_NAME>` (read from the monitor's own process env;
#                        used ONLY for the credential-monitor SA, which cannot `op read` itself)
#   app_id               monitored Azure app (client) id            (entra-client-secret)
#   app_secret_key_id    (optional) the specific secret's keyId to validate, vs app-level min-future
#   user_id              monitored Entra USER's object id (non-secret) (entra-user-password)
#   host                 hostname to probe on :443                  (tls-cert)
#   recorded_expiry      ISO date fallback for the countdown, or null
#   owner                who rotates it
#   keyless_alternative  the keyless path to migrate to (Rule #302 ladder), or null
#   target_rung          credential-lifecycle ladder target (decision 2026-08-17, brain
#                        library/decisions/2026-08-17-credential-lifecycle-no-kevin-touch.md):
#                        0 keyless · 1 self-rotating · 2 non-expiring + monitored + revoke-on-signal
#                        · 3 one Kevin sitting per year at most. Surfaced in alert bodies.
#   rung_by              when the credential must be AT its target rung (ISO date or milestone)
#   non_expiring         true = non-expiring BY DESIGN (rung 2): alive + no expiry → OK, not
#                        NO_EXPIRY; the daily aliveness probe is the monitoring, revoke-on-signal
#                        the response. Never combine with a recorded_expiry (fails loud).
#
# LIFECYCLE LAW (Kevin, 2026-08-17): "I never want to do this again… all of these tokens are
# rotated and we don't need to mint fresh and delete." A WARN/DEAD here is the signal to run the
# credential's MIGRATION to its target rung — never to hand Kevin a fresh mint. Anything that still
# needs a Kevin click is batched into ONE sitting per year at most (rung 3).

# ACUMATICA_GATEWAY_TOKEN (ops-pipeline repo secret) — INVENTORIED 2026-08-14, deliberately NOT a
# probed entry: an sk_acu_* gateway token (consumer `ops-pipeline-cfo-brief`, tenant heritage,
# minted 2026-08-14 via gateway-issue-token.ts) is NON-EXPIRING (no countdown to monitor) and its
# aliveness is already covered by gateway-token-watch.yml, which watches acumatica_tenant_tokens
# directly. Dual-store (#99): gateway DB row (sha256 hash) + this repo's Actions secrets
# (ACUMATICA_GATEWAY_TOKEN + ACUMATICA_GATEWAY_URL). Consumer: cfo-monthly-brief.yml.
# Keyless alternative: none (gateway bearer tokens are the fleet's Acumatica access contract, #311).

credentials:

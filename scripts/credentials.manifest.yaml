# Credential Expiry Monitor — manifest (CLAUDE.md Rule #302)
#
# ⚠️ INVENTORY INCOMPLETE — confirm the FULL list of expiring credentials in the
#    "Studio B Infrastructure" 1Password vault with Kevin before relying on this.
#    The op:// references below are best-guess item paths (this file was authored
#    WITHOUT Infra-vault access); a wrong ref surfaces as PROBE_FAILED, not a silent
#    miss — but verify each `op_ref` against the real Infra-vault item names.
#
# This file holds ONLY op:// references + non-secret metadata — NEVER a credential value.
# At runtime the monitor reads each value via the read-only Infra-vault Service Account
# (OP_SERVICE_ACCOUNT_INFRA) and runs an ACTIVE probe for the credential's REAL expiry /
# aliveness (Rule #302 — not the recorded date).
#
# Per-item fields:
#   name                 unique label (used in alerts + dedup key)
#   type                 1password-sa | npm-granular | github-pat-finegrained
#                        | entra-client-secret | tls-cert
#   op_ref               op:// reference to the value (all types except entra/tls)
#   app_id               monitored Azure app (client) id            (entra-client-secret)
#   app_secret_key_id    (optional) the specific secret's keyId to validate, vs app-level min-future
#   host                 hostname to probe on :443                  (tls-cert)
#   recorded_expiry      ISO date fallback for the countdown, or null
#   owner                who rotates it
#   keyless_alternative  the keyless path to migrate to (Rule #302 ladder), or null

credentials:
  - name: op-sa-acuops-hub
    type: 1password-sa
    op_ref: "op://Studio B Infrastructure/op-sa-acuops-hub/credential"
    recorded_expiry: "2026-08-20"        # rotate-by 2026-07-21 — the monitor's first customer
    owner: kevin
    keyless_alternative: null            # SA tokens have no keyless form yet

  - name: NPM_TOKEN-clients
    type: npm-granular
    op_ref: "op://Studio B Infrastructure/npm-clients-publish/credential"   # VERIFY item name
    recorded_expiry: null                # ← BACKFILL: monitor flags NO_EXPIRY until set
    owner: kevin
    keyless_alternative: "npm OIDC trusted publishing"

  - name: LMMI_REPO_PAT
    type: github-pat-finegrained
    op_ref: "op://Studio B Infrastructure/LMMI_REPO_PAT/credential"          # VERIFY item name
    recorded_expiry: null                # fine-grained PAT — active probe reads the real expiry header
    owner: kevin
    keyless_alternative: "GitHub App installation token"

  - name: entra-exo-app-secret
    type: entra-client-secret
    app_id: "7e2dd464-7ed6-484c-a803-6cf663bd1676"   # the EXO app being monitored
    app_secret_key_id: null              # ← PIN the monitored secret's keyId (non-secret GUID from
                                         #   Azure → App registrations → Certificates & secrets) so a
                                         #   rotation can't mask THIS secret. null = app-level min-future
                                         #   fallback (catches "all expired", not a single rotated-out one).
    recorded_expiry: null                # active probe reads the real endDateTime from Graph
    owner: kevin
    keyless_alternative: "cert-based app auth (EXO already uses cert; secret may be retireable)"

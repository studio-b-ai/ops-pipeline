# Sanctioned skip-by-design check names — Rule #459 amendment (Friday sitting
# 2026-08-28 §3, Mechanic package item 3: "durable allowlist = Mechanic's build").
#
# CONTRACT: a check-run whose conclusion is SKIPPED counts toward "CI clean"
# ONLY when its name appears here under the repo being evaluated. Every other
# SKIPPED entry is UNCLEAN — the gate/train waits for a human (fail-closed).
# Repos absent from this file sanction NOTHING. The per-merge manual form for
# an interactive one-off is `# CHECKS-GATE-EXEMPT: <reason>` on the merge
# command itself — per-train, never standing; this file is the standing set.
#
# WHAT QUALIFIES: checks that skip BY DESIGN on PR events — failure-conditional
# notify jobs, main-only deploy smoke, advisory/shadow suites, jobs gated on a
# decommissioned dependency. WHAT NEVER QUALIFIES: a load-bearing check that
# skips CONDITIONALLY (a skipped deploy/qualification/validation job is exactly
# the state the gate exists to catch — Rule #320's transitive-skip class).
#
# Names are matched EXACTLY against the rollup entry's `name` (check runs) or
# `context` (legacy statuses) — copy them verbatim from a live rollup, template
# artifacts included (see the client-asthetik ui-tests-local entry: GitHub
# reports the UNEXPANDED `${{ inputs.* }}` name when the job skips before
# expansion; the observed string is the key, per the Rule #374 verbatim-mirror
# discipline).
#
# Seeded 2026-08-29 from a live population probe (Rule #465): 15 most-recent
# PRs per sweep-caller repo + both restart-train ticket repos, aggregating
# every conclusion==SKIPPED name. Repos with zero observed skips (ops-pipeline,
# asthetik-trade-theme, asthetik-portal, studiob-price-sync, brain) carry no
# row on purpose.
#
# Consumed by scripts/lib/automerge-skip-allowlist.ts →
# isRollupClean(rollup, sanctionedSkips) in scripts/lib/automerge-classify.ts.
# Editing this file is a normal PR to ops-pipeline (Mechanic-owned); callers
# pick it up on their next sweep via the reusable workflow's @main checkout.
#
# Two independent top-level maps: `repos:` (squasher + train, the original
# fail-closed set) and `train_repos:` (ADDITIVE, restart-train ONLY — see the
# 2026-09-02 ruling below `client-asthetik` in `repos:`).

repos:
  studio-b-ai/bolt-wms:
    - "e2e / flake-detection"
    - "Slack Notification"
  studio-b-ai/webhook-router:
    - "Slack Recovery Notice"
    - "Slack Alert on Failure"
    - "Post-Deploy Smoke"
  studio-b-ai/studiob:
    - "Notify on Failure"
  studio-b-ai/client-asthetik:
    - "qualify / ui-tests-local ${{ inputs.ui_tests_local_path }} (advisory)"
    - "qualify / ui-test-suite @acumatica"
    - "qualify / sandbox publish dry-run"
    - "qualify / Notify on qualifier failure"
    - "Auto-qualifier (shadow)"
    # RULING 2026-08-30 (ops#235; first observed on the ca#314/ca#342
    # Customization merges — absent from the 8/29 seed because that window
    # held no Customization-touching PR): the acuops-build deploy-chain
    # names that skip by design on every pull_request event —
    #   deploy                            (caller: event_name != 'pull_request')
    #   build / Pre-Deploy Qualification  (pipeline: same gate)
    #   build / Validate on Staging       (pipeline: PR-only && dry_run != true,
    #                                      and the caller pins dry_run=true on
    #                                      ALL pull_request events)
    #   build / 24h Dispatch Cap          (pipeline: same gate)
    # — are deliberately NOT sanctioned here, even though each was verified
    # event-gated from its origin/main if: condition. The committed-data-file
    # test's Rule #320 ban on deploy/build-prefixed names is load-bearing for
    # the SQUASHER's unattended code merges: it keeps that path from ever
    # green-lighting a Customization merge, which fires a Heritage app-pool
    # restart (Rule #11). Customization merges via the squasher are always
    # Kevin-worded and interactive — use the per-merge
    # `# CHECKS-GATE-EXEMPT: <reason>` form there. "build / build-bin" is
    # additionally content-conditional (detect-code-change.code_changed) —
    # the exact transitive-skip state the gate exists to catch.

  # RULING 2026-09-03 (ops#274 — Mechanic seat): both repos still carry the
  # pre-ops#250 in-repo `Auto-Approve & Merge` job in their own ci.yml. Now
  # that they are enrolled in the fleet sweep (ops#273) and their review gate
  # honors Kevin's `queued` (studiob#639 ports acudev#47 / acuops#168), that
  # job is (1) a rollup blocker — it triggers on the default pull_request
  # event set (opened/synchronize/reopened) and skips-by-design once
  # `Require review label` is red, without re-running on the `labeled`
  # event when `queued` later greens the review gate; the sweep's
  # ci-rollup then sees the stale entry and refuses (Rule #459). And (2)
  # it is a SECOND MERGER on the same PRs — the sweep merges sha-pinned on
  # a roster human's label, this job auto-merges on "build green + nothing
  # red" (Rule #485: one door). Sanctioning `Auto-Approve & Merge` under
  # `repos:` here is the INTERIM fix — it clears the rollup blocker so the
  # sweep can operate; the DURABLE fix is retiring the job from both
  # repos (the ops#250 pattern applied to their own ci.yml). "Auto-Approve
  # & Merge" is NOT a load-bearing check whose absence the sweep needs to
  # notice (the sweep itself is the load-bearing merger); sanctioning it
  # here does not weaken the Rule #320 protections above — it withdraws a
  # deprecated in-repo second-merger from the CI leg.
  studio-b-ai/acudev:
    - "Auto-Approve & Merge"
  studio-b-ai/acuops-pipeline:
    - "Auto-Approve & Merge"

# RULING 2026-09-02 (amends the ops#235 ruling above; incident: the restart
# train's 22:18Z first after-hours tick refused studio-b-ai/client-asthetik#359
# citing these same 5 by-design PR-event skips — "Auto-qualifier (shadow)" is
# excluded from this list on purpose: it is ALREADY sanctioned under `repos:`
# above, for both the squasher and the train via the union, so restating it
# here would be redundant, not additive): `train_repos:` is a SECOND,
# NARROWER sanction set consumed ONLY by the restart train's
# `loadTrainSanctionedSkips()` (never `loadSanctionedSkips()`, never the
# squasher). The train's merge authority is Kevin's label + the window law
# (ops#265) — CI is advisory there, not the sole gate the ops#235 ruling was
# protecting against. Every name below was independently re-verified
# event-gated from client-asthetik's origin/main `if:` conditions (deploy:
# event_name != 'pull_request'; build / Pre-Deploy Qualification and
# build / Validate on Staging and build / 24h Dispatch Cap: the caller pins
# dry_run=true on every pull_request event; build / build-bin: content-gated
# on detect-code-change.code_changed, which this repo's Customization-only
# diffs never trip). Every name listed here IS still forbidden under `repos:`
# above — the squasher ban is untouched.
train_repos:
  studio-b-ai/client-asthetik:
    - "deploy"
    - "build / Pre-Deploy Qualification"
    - "build / Validate on Staging"
    - "build / build-bin"
    - "build / 24h Dispatch Cap"

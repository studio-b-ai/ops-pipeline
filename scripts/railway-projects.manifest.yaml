# Railway Volume Usage Monitor — known-projects safety-net manifest (CLAUDE.md Rule #302 family).
#
# The monitor tries the GraphQL `projects(first:)` root query to discover every project visible
# to RAILWAY_API_TOKEN — the ideal fleet-wide path, no manifest maintenance needed — and UNIONS
# whatever it finds with this list (deduped by id), rather than treating this manifest as an
# either/or fallback. When the root query errors entirely, this list is ALL the monitor checks.
#
# That degradation path is REAL, verified-live, not a hypothetical: probing the actual Railway API
# on 2026-07-27 with a real (CLI-session) account token, `projects(first:)` returned
# `{"errors":[{"message":"Not Authorized"}], "data": null}` while `project(id: "...")` on the SAME
# token worked fine for every project below. Whatever scope RAILWAY_API_TOKEN ends up with
# (Account or Workspace — see lib/railway-volume-probes.ts file header), this manifest is what
# keeps the monitor fleet-wide if the root query is unavailable, or only partially scoped, to it.
#
# Keep this easy to extend: add a project below and the next run picks it up, no code change.
# Get a project's id: `railway status` inside a linked checkout, the Railway dashboard (project
# settings → the id in the URL), or `railway list-projects`-style tooling if you have it wired.
#
# This list reflects every project in the "kbibelhausen's Projects" workspace as of 2026-08-12
# (context-engine / relay / aesthetik-staging deleted from Railway in the ops#21 retirements)
# (enumerated read-only, not guessed). If Kevin's RAILWAY_API_TOKEN is scoped to a different
# team/workspace, add that workspace's projects here too.

projects:
  - id: "186573d8-0b87-4013-a464-dcda9b1eed0f"
    name: aesthetik-production # tonight's incident project — Rule #302 family origin
  - id: "433dec0e-6963-4b66-bdd2-6049ba189b81"
    name: studiob-platform
  - id: "4a91ebb7-ca74-4b6d-b0de-cb7df897902a"
    name: shuttle
  - id: "f5ac41ed-733e-4ecc-b68c-a5ba02b9dd96"
    name: gi-lint
  - id: "ad6f97b7-5b83-4104-b857-3550cebffff0"
    name: wasala-platform
    # ops#71 Leg 2 (Kevin-authorized 2026-08-12): ops#12 is a diagnosed-static corpus — 79.3% used
    # (158,609MB/200,000MB), measured FLAT (-36MB over 4 days), no resize warranted. Without this
    # override the issue must stay open forever purely as dedup state (global WARN threshold =
    # 75%). Keyed by volume_instance_id (NOT path/name) so this can never suppress a same-named
    # volume in a different environment; `path` is cross-checked against the live record at match
    # time and a mismatch means the override does NOT apply (see lib/railway-volume-accept.ts).
    # The 85% ceiling below is provisional per Kevin's decision #2 until L2-P0's fresh usage
    # reading confirms; review_by forces re-diagnosis regardless.
    accepted_volumes:
      - volume_instance_id: "a622cddb-8faf-4364-9dc2-75ba1b063967"
        path: "wasala-platform/production/Postgres/postgres-volume"
        accepted_below_pct: 85
        review_by: "2026-11-30"
        reason: "Diagnosed-static corpus (ops#12): 79.3% used (158,609MB/200,000MB), measured FLAT (-36MB over 4 days) — no resize warranted as of 2026-08-12."
        issue: 12
  - id: "c7dbd520-ef13-4a61-854b-98f282069258"
    name: bolt-roth
  - id: "559b6644-c297-4696-b3e9-fa31a89092de"
    name: nzt

# Railway Volume Usage Monitor — known-projects fallback manifest (CLAUDE.md Rule #302 family).
#
# The monitor FIRST tries the GraphQL `projects(first:)` root query to discover every project
# visible to RAILWAY_API_TOKEN — the ideal fleet-wide path, no manifest maintenance needed. It
# falls back to this list ONLY when that field errors.
#
# That fallback is a REAL, verified-live path, not a hypothetical: probing the actual Railway API
# on 2026-07-27 with a real account token, `projects(first:)` returned
# `{"errors":[{"message":"Not Authorized"}], "data": null}` while `project(id: "...")` on the SAME
# token worked fine for every project below. Whatever scope RAILWAY_API_TOKEN ends up with, this
# manifest is what keeps the monitor fleet-wide if the root query is unavailable to it too.
#
# Keep this easy to extend: add a project below and the next run picks it up, no code change.
# Get a project's id: `railway status` inside a linked checkout, the Railway dashboard (project
# settings → the id in the URL), or `railway list-projects`-style tooling if you have it wired.
#
# This list reflects every project in the "kbibelhausen's Projects" workspace as of 2026-07-27
# (enumerated read-only, not guessed). If Kevin's RAILWAY_API_TOKEN is scoped to a different
# team/workspace, add that workspace's projects here too.


# backlog-managers.yaml — ops-pipeline#136 (backlog-staleness leg, LANES rule 17 fleet
# instrument, CTO seat → CoS, Kevin word 2026-08-16). Consumed by
# scripts/backlog-staleness-worker.ts (read-only — this file is committed config, never
# written by the worker itself).
#
# `repos:` maps each fleet repo the leg scans to the SEAT/LANE that owns its backlog
# (rule-15 map, initial pass) — managers may correct rows by PR later; getting the map
# imperfect on day one is fine, the leg's job is to make a missed rule-17(d) stall check
# VISIBLE, not to be the source of truth on ownership itself. An unmapped repo simply isn't
# scanned (no "unmapped repo" finding class in v1 — out of scope, see ops#136).
#
# `thresholds:` — the rule-17 staleness bounds (days). `machinery_labels:` — labels that
# mark an issue as auto-reconciled MONITOR OUTPUT rather than lane backlog (Rule #165); an
# issue carrying one of these is excluded from ranking checks ONLY when it ALSO carries no
# P0–P3 label (a machinery-labeled issue a human has since prioritized with a P-label is
# real backlog again — see scripts/lib/backlog-staleness-lib.ts's header for the exact
# predicate and the credential-monitor+P1 worked example).

repos:
  - repo: "studio-b-ai/ops-pipeline"
    manager: "CTO"
  - repo: "studio-b-ai/webhook-router"
    manager: "CTO"
  - repo: "studio-b-ai/client-asthetik"
    manager: "CTO"
    note: "Acumatica lane"
  - repo: "studio-b-ai/acuops-pipeline"
    manager: "CTO"
  - repo: "studio-b-ai/acudev"
    manager: "CTO"
  - repo: "studio-b-ai/clients"
    manager: "CTO"
  - repo: "studio-b-ai/bolt-wms"
    manager: "COO"
    shared: true
    note: "multi-lane repo (Pricing · Wayfair · CD · Zoom Workspace · Procurement Hub …); the COO is the largest owner and routes the rest (CoS remap 2026-08-16); one `next` per lane is legitimate → multi-next not evaluated"
  - repo: "studio-b-ai/studiob"
    manager: "CTO"
    shared: true
    note: "studiob-api/gateway = fleet (CTO); zoom-intake questions belong to the Zoom Workspace lane (CTO-managed) — CoS remap 2026-08-16"
  - repo: "studio-b-ai/brain"
    manager: "CoS"
    note: "the vault — CoS remap 2026-08-16"
  - repo: "studio-b-ai/studiob-price-sync"
    manager: "CMO"
    note: "Shopify lane"
  - repo: "studio-b-ai/asthetik-trade-theme"
    manager: "CMO"
    note: "Shopify lane"
  - repo: "studio-b-ai/asthetik-portal"
    manager: "COO"
  - repo: "studio-b-ai/asthetik-marketing"
    manager: "CMO"

thresholds:
  p0p1_days: 2
  p2_days: 14
  unranked_days: 3

# Entries may carry ONE leading or trailing `*` (see labelMatchesPattern in the lib) so whole
# monitor families are exempt without enumerating each label — CoS refinement 2026-08-16 after
# the first live firing flagged auto-reconciled monitor issues (bolt#1413/#1414/#1578) as backlog.
machinery_labels:
  - "bug"
  - "dead-cron"
  - "needs-human"
  - "backlog-staleness"
  - "credential-monitor"
  - "machinery"
  - "machinery-alert"
  - "*-health"
  - "*-failed-sync"
  - "so-import-rescue"
  - "awaiting-approval"

# compliance: — ops-pipeline#151 (backlog COMPLIANCE leg, LANES rule 17(g), Kevin word
# 2026-08-17 ~02:20 ET via CoS: "make sure you're enforcing all sessions to be keeping
# gittracked backlogs which are first ranked and prioritized by the lane, then the manager,
# then the cos then kevin"). Distinct instrument from `repos:`/`thresholds:`/
# `machinery_labels:` above (which drive backlog-staleness-worker.ts over GitHub issues) —
# this leg reads `studio-b-ai/brain` LANES.md rows + their briefs and checks PRESENCE /
# FRESHNESS / SHAPE of the git-tracked ranked-backlog section itself. Consumed by
# scripts/backlog-compliance-worker.ts (read-only — never written by the worker). Full
# grammar + checks table: brain `library/product/2026-08-17-backlog-compliance-leg-design.md`.
compliance:
  brain_repo: "studio-b-ai/brain"
  lanes_file: "LANES.md"
  # Rollout dates (config diff, not a code change — design doc §2): before
  # per_lane_issues_from, findings land on ONE fleet rollup issue; after it, one issue per
  # non-compliant lane. Before manager_stamp_enforced_from / cos_stamp_enforced_from, F2/F3
  # report as `pending` rather than failures (managers/CoS get one tick/census cycle first).
  per_lane_issues_from: "2026-08-21T12:00:00Z"
  manager_stamp_enforced_from: "2026-08-19T12:00:00Z"
  cos_stamp_enforced_from: "2026-08-22T12:00:00Z"
  lane_stamp_max_age_days: 7
  manager_lag_max_hours: 48
  cos_stamp_max_age_days: 7
  # Row name -> brief path overrides. RESOLUTION PRECEDENCE (CoS refinement 2026-08-17,
  # supersedes the row-text-first draft): this map wins FIRST (an explicit human mapping
  # always beats row text), THEN the row's own (coldstarts|library/backlogs)/....md mention,
  # THEN the library/backlogs/<slug>.md default. Seeded from the CoS census table (8/17
  # 07:1xZ) — every key below verified byte-exact (NFC) against a real LANES.md row name.
  # "Zoom Workspace" pins the CURRENT brief explicitly: the row mentions two coldstarts
  # files (the row-text-first match alone would not reliably resolve to the current one) —
  # this override makes the resolution deterministic regardless of row-text ordering.
  # "Task Sync Build"/"Answering Service"/"Procurement Hub" name no brief in row text at
  # all; the explicit entries here document what the slug default already resolves to (the
  # latter two files do not exist yet — expected P1 findings until the COO creates them).
  # A briefs: key matching no LANES.md row name is a WARN in the worker's run output, never
  # silent (unmatchedBriefKeys() in the lib).
  briefs:
    "Chief of Staff": "coldstarts/2026-08-04-chief-of-staff-reentry.md"
    "CTO": "coldstarts/2026-08-04-cto-seat-reentry.md"
    "CFO": "coldstarts/2026-08-05-cfo-seat.md"
    "CMO": "coldstarts/cmo-seat-reentry.md"
    "Creative Director": "coldstarts/2026-08-05-creative-director-seat.md"
    "COO": "coldstarts/coo-seat-reentry.md"
    "General Counsel": "coldstarts/general-counsel-reentry.md"
    "Pricing": "coldstarts/pricing-lane-reentry.md"
    "HubSpot Platform": "coldstarts/hubspot-platform-reentry.md"
    "Shopify": "coldstarts/2026-08-15-shopify-lane.md"
    "Wayfair": "coldstarts/2026-08-14-wayfair-lane.md"
    "Faire": "coldstarts/2026-08-14-faire-lane.md"
    "Ästhetik Films": "coldstarts/asthetik-films-reentry.md"
    "Deep River": "coldstarts/2026-08-13-asthetik-rail-deep-river-lane-reentry.md"
    "Ästhetik Image Studio": "coldstarts/2026-08-04-asthetik-image-studio.md"
    "MTM lane": "coldstarts/2026-08-08-mtm-prolific-readiness.md"
    "Studio B Corporate": "coldstarts/2026-08-04-studiob-corporate.md"
    "Zoom Workspace": "coldstarts/2026-08-12-zoom-workspace-lane.md"
    "Acumatica": "coldstarts/2026-08-15-acumatica-lane.md"
    "Task Sync Build": "library/backlogs/task-sync-build.md"
    "Answering Service": "library/backlogs/answering-service.md"
    "Procurement Hub": "library/backlogs/procurement-hub.md"
  # Row names (exact, as parsed from the row's bold first-cell name) that this leg never
  # checks — independent of lifecycle class (ARCHIVED/TOMBSTONED are already always skipped).
  skip:
    - "api-bot stale-string fleet scrub" # WRAPPED 8/16, archive proposed — remove when the row is ARCHIVED
